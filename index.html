<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Premiere MCP Bridge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="panel-shell" aria-label="Premiere MCP Bridge">
      <section class="controls" aria-label="Bridge controls">
        <div id="connection-control" class="action">
          <button id="toggle-connection" type="button">Stop</button>
          <span id="connection-label" class="action-face" aria-hidden="true">Stop</span>
        </div>
        <div id="reload-control" class="action reload">
          <button id="reload-bridge" type="button">Reload</button>
          <span class="action-face" aria-hidden="true">Reload</span>
        </div>
      </section>
      <div class="status-row">
        <div id="folder-control" class="action folder">
          <button id="choose-media-folder" type="button" aria-label="Choose a folder for file access" aria-describedby="file-tooltip"></button>
          <span class="action-face" aria-hidden="true"><img class="folder-icon" src="assets/folder.svg" alt="" width="24" height="24" /><span class="folder-label">Files</span></span>
        </div>
        <section id="bridge-status" class="status-box" aria-label="Bridge status">
          <div class="status-copy">
            <p id="status" role="status" aria-live="polite">Starting…</p>
            <p id="error" class="error" role="alert"></p>
          </div>
          <a id="plugin-version" class="version" href="https://github.com/ywdagency/premiere-mcp-bridge" tabindex="0" aria-label="Plugin version" title="Open GitHub"></a>
        </section>
      </div>
      <div id="file-tooltip" class="file-tooltip" role="tooltip" aria-hidden="true">
        <p id="file-tooltip-title" class="tooltip-title"></p>
        <p id="file-tooltip-folder" class="tooltip-folder"></p>
        <p id="file-tooltip-help" class="tooltip-help"></p>
      </div>
    </main>
    <script src="dist/main.js"></script>
  </body>
</html>
